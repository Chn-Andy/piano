<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>心琴 · 斗琴</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #ece7db;
        overflow: hidden;
      }
      #stage {
        display: block;
        width: 100%;
        height: 100%;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: rgba(236, 231, 219, 0.92);
        color: #2b2a26;
        font-family: 'Songti SC', 'Noto Serif SC', 'SimSun', serif;
        user-select: none;
        cursor: pointer;
        transition: opacity 0.4s ease;
      }
      #overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #overlay h1 {
        margin: 0;
        font-size: 64px;
        font-weight: 600;
        letter-spacing: 0.35em;
        text-indent: 0.35em;
      }
      #overlay p {
        margin: 0;
        font-size: 17px;
        color: #57544c;
      }
      #overlay kbd {
        display: inline-block;
        min-width: 1.4em;
        padding: 2px 7px;
        margin: 0 2px;
        border: 1px solid #b7b1a1;
        border-bottom-width: 3px;
        border-radius: 6px;
        background: #faf7ef;
        font-family: inherit;
        font-size: 16px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="overlay">
      <h1>心琴</h1>
      <p id="overlay-message">点击此处或按任意键 · 开始斗琴 —— 卡农（中等）</p>
      <p>
        白键 <kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><kbd>F</kbd><kbd>G</kbd><kbd>H</kbd><kbd>J</kbd>
        · 黑键 <kbd>W</kbd><kbd>E</kbd><kbd>T</kbd><kbd>Y</kbd><kbd>U</kbd> 嵌于白键之间
      </p>
      <p>命中化剑气斩墨妖 · 连击抬伤害 · 和弦齐按成重击 · Miss 挨反击掉血</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
