<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>心琴 · 斗琴</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #efe9dc;
        overflow: hidden;
        /* 触控板/滚轮的边界回弹也不许把画面带着走（工单 16：菜单里按方向键
           曾经让整屏跟着移动；按键侧的默认行为在 main.ts 里吞掉） */
        overscroll-behavior: none;
      }
      #stage {
        display: block;
        width: 100%;
        height: 100%;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: rgba(239, 233, 220, 0.78);
        color: #1d1a15;
        font-family: 'Songti SC', 'Noto Serif SC', 'SimSun', serif;
        user-select: none;
        transition: opacity 0.55s ease;
      }
      #overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        max-height: 100vh;
        padding: 24px 0;
        box-sizing: border-box;
      }
      .screen h1 {
        position: relative;
        margin: 0;
        color: #1d1a15;
        font-size: 58px;
        font-weight: 600;
        letter-spacing: 0.35em;
        text-indent: 0.35em;
        animation: inkBreath 6s ease-in-out infinite;
      }
      .screen h1.title-mark::after {
        content: attr(data-seal);
        position: absolute;
        right: -1.55em;
        bottom: -0.1em;
        display: grid;
        width: 1.05em;
        height: 1.05em;
        place-items: center;
        border: 1px solid #a03d2c;
        color: #a03d2c;
        font-size: 0.25em;
        line-height: 1;
        letter-spacing: 0;
        text-indent: 0;
        transform: rotate(-5deg);
        opacity: 0.78;
      }
      .screen h2 {
        margin: 0;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-indent: 0.2em;
      }
      .screen p {
        margin: 0;
        font-size: 16px;
        color: #57544c;
        line-height: 1.7;
        text-align: center;
      }
      .screen > p:first-of-type {
        color: #6c675d;
      }
      .start-prompt {
        color: #37322a !important;
        font-size: 18px !important;
        letter-spacing: 0.08em;
        animation: promptBreath 2.8s ease-in-out infinite;
      }
      .start-prompt::before,
      .start-prompt::after {
        display: inline-block;
        color: #a03d2c;
        content: '·';
        font-size: 1.1em;
        opacity: 0.72;
      }
      .start-prompt::before { margin-right: 0.55em; }
      .start-prompt::after { margin-left: 0.55em; }
      .hint {
        margin-top: 6px;
        font-size: 14px;
        color: #777166;
      }
      kbd {
        display: inline-block;
        min-width: 1.4em;
        padding: 2px 7px;
        margin: 0 2px;
        border: 1px solid #9e9788;
        border-bottom-width: 3px;
        border-radius: 2px;
        background: rgba(250, 247, 239, 0.72);
        font-family: inherit;
        font-size: 15px;
        text-align: center;
      }
      /* ── 语言切换（ADR-0017）──
         两个入口：曲库标题右侧的常驻角标（不必进设置就能切）与设置面板里那一行。
         角标上写的是**将要切过去的语言**（中文界面显示 EN），设置里两个选项
         各用该语言自己的写法（中文 / English），读不懂另一种的人也找得到。 */
      .library-head {
        display: flex;
        align-items: baseline;
        gap: 14px;
      }
      .lang-badge {
        padding: 2px 9px;
        border: 1px solid #c9c2af;
        border-radius: 2px;
        background: transparent;
        color: #57544c;
        font-family: inherit;
        font-size: 13px;
        letter-spacing: 0.08em;
        cursor: pointer;
      }
      .lang-badge:hover {
        border-color: #55503f;
        color: #2b2a26;
      }
      .lang-switch {
        display: flex;
        gap: 8px;
      }
      .lang-switch button {
        flex: 0 0 auto;
        padding: 6px 18px;
        border: 1px solid #c9c2af;
        border-radius: 2px;
        background: #f6f2e8;
        color: #57544c;
        font-family: inherit;
        font-size: 15px;
        cursor: pointer;
      }
      .lang-switch button.selected {
        border-color: #2b2a26;
        border-width: 2px;
        background: #faf7ef;
        color: #1d1a15;
      }
      /* ── 曲库 ── */
      .song-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: min(640px, 90vw);
      }
      .song-row {
        display: grid;
        grid-template-columns: 180px 1fr;
        align-items: center;
        gap: 16px;
        padding: 10px 16px;
        border: 1px solid #d8d2c2;
        border-radius: 2px;
        background: rgba(250, 247, 239, 0.55);
      }
      .song-name {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.12em;
      }
      /* 英文曲名要收一点字距：曲名栏 180px，*Spring River* 12 个字符在 0.12em
         下实测约 187px 会折行；收到 0.04em 后约 165px，单行放下（票 25）。
         中文曲名照旧 0.12em——汉字宽，字距是这套版式的一部分。 */
      html[lang='en'] .song-name {
        letter-spacing: 0.04em;
      }
      .song-blurb {
        font-size: 13px;
        color: #8a857a;
        margin-top: 2px;
      }
      .diff-cells {
        display: flex;
        gap: 8px;
      }
      .diff-cell {
        flex: 1;
        padding: 8px 6px;
        border: 1px solid #c9c2af;
        border-radius: 2px;
        background: #f6f2e8;
        text-align: center;
        cursor: pointer;
        font-family: inherit;
      }
      .diff-cell.selected {
        border-color: #2b2a26;
        border-width: 2px;
        background: #faf7ef;
        box-shadow: 0 2px 8px rgba(43, 42, 38, 0.12);
      }
      .diff-name {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 5px;
        font-size: 16px;
        font-weight: 600;
      }
      /* 主题曲「原曲」小签（ADR-0019）：只在带全轨的难度上出现，不另起一行 */
      .diff-original {
        padding: 1px 4px;
        border: 1px solid #c9c2af;
        border-radius: 2px;
        color: #8a857a;
        font-size: 9px;
        font-weight: 500;
        letter-spacing: 0.04em;
      }
      .diff-length {
        margin-top: 2px;
        font-size: 12px;
        letter-spacing: 0.06em;
        color: #8a857a;
      }
      .reached-line {
        font-size: 15px;
        letter-spacing: 0.08em;
        color: #57544c;
      }
      .reached-line.defeat {
        color: #a03d2c;
      }
      .diff-best {
        margin-top: 3px;
        font-size: 13px;
        color: #57544c;
        min-height: 1.2em;
      }
      .best-rating {
        font-weight: 700;
        margin-right: 5px;
      }
      .rating-S { color: #8a6d1f; }
      .rating-A { color: #37322a; }
      .rating-B { color: #57544c; }
      .rating-C { color: #a03d2c; }
      /* ── 键位图示（钢琴预览）── */
      /* 定宽框：最宽键区（12 个白键 × 46px ≈ 552px）留出常量空间，琴键居中。
         换难度时图示只是换键数，不推着整个菜单左右移动（工单 16）。 */
      .piano-frame {
        display: flex;
        justify-content: center;
        width: min(560px, 88vw);
      }
      .piano-preview {
        position: relative;
        flex: 0 0 auto;
        height: 74px;
        margin-top: 8px;
      }
      .pk {
        position: absolute;
        top: 26px;
        width: 46px;
        height: 46px;
        border: 1px solid #b7b1a1;
        border-bottom-width: 4px;
        border-radius: 2px;
        background: #faf7ef;
        font-size: 17px;
        line-height: 46px;
        text-align: center;
        box-sizing: border-box;
        color: #57544c;
      }
      .pk.black {
        top: 0;
        width: 30px;
        height: 32px;
        line-height: 32px;
        font-size: 13px;
        border-color: #55503f;
        background: #37322a;
        color: #efe9dc;
        z-index: 1;
      }
      .pk.lit {
        background: #37322a;
        color: #efe9dc;
        border-color: #37322a;
      }
      /* ── 按钮 ── */
      .actions {
        display: flex;
        gap: 14px;
        margin-top: 10px;
      }
      .actions button {
        padding: 10px 26px;
        border: 1px solid #55503f;
        border-radius: 2px;
        background: #37322a;
        color: #efe9dc;
        font-family: inherit;
        font-size: 17px;
        letter-spacing: 0.15em;
        cursor: pointer;
      }
      .actions button.secondary {
        background: transparent;
        color: #37322a;
      }
      .actions button:hover {
        box-shadow: 0 2px 10px rgba(43, 42, 38, 0.25);
      }
      /* ── 设置（工单 06）── */
      .settings-box {
        display: flex;
        flex-direction: column;
        gap: 18px;
        width: min(560px, 88vw);
        padding: 20px 26px;
        border: 1px solid #d8d2c2;
        border-radius: 2px;
        background: rgba(250, 247, 239, 0.55);
      }
      .setting-row {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .setting-row label {
        font-size: 16px;
        color: #2b2a26;
      }
      .setting-row label b {
        color: #8a6d1f;
        margin-left: 6px;
      }
      .setting-row input[type='range'] {
        width: 100%;
        accent-color: #37322a;
        cursor: pointer;
      }
      /* ── 结算 · 演奏卡（票 19）──
         一屏可读：字号与间距随视高收放（clamp / 短屏媒体查询），
         800×600 与 1440×900 都不裁字、不出现横向滚动。 */
      .screen.settlement {
        gap: 10px;
        padding: 16px 0;
      }
      .play-card {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: min(560px, 92vw);
        padding: 12px 18px 10px;
        border: 1px solid #c9c2af;
        border-radius: 2px;
        background: rgba(250, 247, 239, 0.86);
        box-shadow: 0 2px 14px rgba(43, 42, 38, 0.08);
        box-sizing: border-box;
        text-align: left;
      }
      .card-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        min-width: 0;
      }
      .card-song {
        font-size: 21px;
        font-weight: 600;
        letter-spacing: 0.1em;
        white-space: nowrap;
      }
      .card-diff {
        padding: 1px 8px;
        border: 1px solid #c9c2af;
        font-size: 12px;
        color: #6c675d;
        white-space: nowrap;
      }
      .card-record,
      .card-best {
        margin-left: auto;
        font-size: 12px;
        white-space: nowrap;
      }
      .card-record {
        padding: 1px 8px;
        border: 1px solid #8a6d1f;
        color: #8a6d1f;
        letter-spacing: 0.18em;
      }
      .card-best {
        color: #777166;
        letter-spacing: 0.04em;
      }
      .card-body {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .card-rating {
        flex: 0 0 auto;
        min-width: 1.1em;
        font-size: clamp(44px, 8.4vh, 78px);
        font-weight: 700;
        line-height: 1;
        text-align: center;
      }
      .card-stats {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 12px;
        margin: 0;
        flex: 1;
      }
      .card-stats > div {
        display: contents;
      }
      .card-stats dt {
        font-size: 12px;
        letter-spacing: 0.12em;
        color: #777166;
      }
      .card-stats dd {
        margin: 0;
        font-size: clamp(15px, 2.2vh, 18px);
        font-weight: 600;
        color: #2b2a26;
      }
      .screen p.card-foot {
        font-size: 12px;
        line-height: 1.5;
        color: #6c675d;
        text-align: left;
      }
      .card-replay {
        display: flex;
        align-items: center;
        gap: 12px;
        padding-top: 8px;
        border-top: 1px dashed #d8d2c2;
        flex-wrap: wrap;
      }
      .card-replay button {
        padding: 6px 15px;
        border: 1px solid #55503f;
        border-radius: 2px;
        background: transparent;
        color: #37322a;
        font-family: inherit;
        font-size: 15px;
        letter-spacing: 0.12em;
        cursor: pointer;
      }
      .card-replay button:hover {
        background: rgba(55, 50, 42, 0.06);
      }
      .replay-note {
        font-size: 12px;
        color: #8a857a;
        letter-spacing: 0.04em;
      }
      /* 掌握度徽记（GLOSSARY 的三个词）：只描述这一局，不是段位/成就 */
      .mastery {
        padding: 1px 9px;
        border: 1px solid currentColor;
        border-radius: 2px;
        font-size: 13px;
        letter-spacing: 0.1em;
        white-space: nowrap;
      }
      .mastery-first { color: #57544c; }
      .mastery-seasoned { color: #37322a; }
      .mastery-mastered { color: #8a6d1f; }
      .mastery-none { color: #a03d2c; }
      .diff-best .mastery {
        margin-left: 6px;
        padding: 0 5px;
        font-size: 11px;
      }
      .stats-line {
        font-size: 15px;
      }
      .stats-line b {
        font-weight: 700;
      }
      @keyframes inkBreath {
        0%, 100% { opacity: 0.92; transform: translateY(0); }
        50% { opacity: 1; transform: translateY(-1px); }
      }
      @keyframes promptBreath {
        0%, 100% { opacity: 0.72; }
        50% { opacity: 1; }
      }
      /* 720p（itch 嵌入的标准视口）：四行曲库 + 键位预览 + 提示行必须一屏放下。
         只收间距/字号，不动栏宽与行结构；更矮的窗口仍交给下面的 660 规则。 */
      @media (max-height: 760px) {
        .screen:not(.settlement) {
          gap: 10px;
          padding: 14px 0;
        }
        .screen:not(.settlement) h1 {
          font-size: 52px;
        }
        .screen:not(.settlement) .song-list {
          gap: 8px;
        }
        .screen:not(.settlement) .song-row {
          padding: 8px 16px;
        }
        .screen:not(.settlement) .piano-preview {
          height: 70px;
          margin-top: 4px;
        }
        .screen:not(.settlement) .actions {
          margin-top: 6px;
        }
      }
      @media (max-height: 640px) {
        .screen.settlement {
          gap: 7px;
          padding: 8px 0;
        }
        .play-card {
          gap: 6px;
          padding: 9px 16px 8px;
        }
      }
      /* 短窗口（≤ 660px 高）：非结算画面不许裁字（v1.4 审查 A4）。
         800×600 下曲库内容曾高 628px、底部提示行被裁 28px 且不可滚——方向键
         被游戏吃掉，键盘滚动指望不上，所以首先把内容收紧到一屏之内；真遇到
         更矮的窗口，再让面板自己滚（滚轮仍可用），而不是让字掉出视口。 */
      @media (max-height: 660px) {
        .screen:not(.settlement) {
          gap: 11px;
          padding: 14px 0;
          max-height: 100vh;
          overflow-y: auto;
          overscroll-behavior: contain;
        }
        .screen:not(.settlement) h1 {
          font-size: 48px;
        }
        .screen:not(.settlement) h2 {
          font-size: 23px;
        }
        .screen:not(.settlement) .song-list {
          gap: 7px;
        }
        .screen:not(.settlement) .song-row {
          padding: 7px 14px;
        }
        .screen:not(.settlement) .song-name {
          font-size: 20px;
        }
        .screen:not(.settlement) .piano-preview {
          height: 64px;
          margin-top: 5px;
        }
        .screen:not(.settlement) .pk {
          top: 20px;
          height: 42px;
          line-height: 42px;
        }
        .screen:not(.settlement) .pk.black {
          top: 0;
          height: 30px;
          line-height: 30px;
        }
        .screen:not(.settlement) .actions {
          margin-top: 6px;
        }
        .screen:not(.settlement) .actions button {
          padding: 8px 24px;
          font-size: 16px;
        }
        .screen:not(.settlement) .hint {
          margin-top: 2px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .screen h1,
        .start-prompt {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="overlay"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
