<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>心琴 · 斗琴</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #efe9dc;
        overflow: hidden;
      }
      #stage {
        display: block;
        width: 100%;
        height: 100%;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: rgba(239, 233, 220, 0.78);
        color: #1d1a15;
        font-family: 'Songti SC', 'Noto Serif SC', 'SimSun', serif;
        user-select: none;
        transition: opacity 0.55s ease;
      }
      #overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        max-height: 100vh;
        padding: 24px 0;
        box-sizing: border-box;
      }
      .screen h1 {
        position: relative;
        margin: 0;
        color: #1d1a15;
        font-size: 58px;
        font-weight: 600;
        letter-spacing: 0.35em;
        text-indent: 0.35em;
        animation: inkBreath 6s ease-in-out infinite;
      }
      .screen h1.title-mark::after {
        content: '琴';
        position: absolute;
        right: -1.55em;
        bottom: -0.1em;
        display: grid;
        width: 1.05em;
        height: 1.05em;
        place-items: center;
        border: 1px solid #a03d2c;
        color: #a03d2c;
        font-size: 0.25em;
        line-height: 1;
        letter-spacing: 0;
        text-indent: 0;
        transform: rotate(-5deg);
        opacity: 0.78;
      }
      .screen h2 {
        margin: 0;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-indent: 0.2em;
      }
      .screen p {
        margin: 0;
        font-size: 16px;
        color: #57544c;
        line-height: 1.7;
        text-align: center;
      }
      .screen > p:first-of-type {
        color: #6c675d;
      }
      .start-prompt {
        color: #37322a !important;
        font-size: 18px !important;
        letter-spacing: 0.08em;
        animation: promptBreath 2.8s ease-in-out infinite;
      }
      .start-prompt::before,
      .start-prompt::after {
        display: inline-block;
        color: #a03d2c;
        content: '·';
        font-size: 1.1em;
        opacity: 0.72;
      }
      .start-prompt::before { margin-right: 0.55em; }
      .start-prompt::after { margin-left: 0.55em; }
      .hint {
        margin-top: 6px;
        font-size: 14px;
        color: #777166;
      }
      kbd {
        display: inline-block;
        min-width: 1.4em;
        padding: 2px 7px;
        margin: 0 2px;
        border: 1px solid #9e9788;
        border-bottom-width: 3px;
        border-radius: 2px;
        background: rgba(250, 247, 239, 0.72);
        font-family: inherit;
        font-size: 15px;
        text-align: center;
      }
      /* ── 曲库 ── */
      .song-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: min(640px, 90vw);
      }
      .song-row {
        display: grid;
        grid-template-columns: 180px 1fr;
        align-items: center;
        gap: 16px;
        padding: 10px 16px;
        border: 1px solid #d8d2c2;
        border-radius: 2px;
        background: rgba(250, 247, 239, 0.55);
      }
      .song-name {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.12em;
      }
      .song-blurb {
        font-size: 13px;
        color: #8a857a;
        margin-top: 2px;
      }
      .diff-cells {
        display: flex;
        gap: 8px;
      }
      .diff-cell {
        flex: 1;
        padding: 8px 6px;
        border: 1px solid #c9c2af;
        border-radius: 2px;
        background: #f6f2e8;
        text-align: center;
        cursor: pointer;
        font-family: inherit;
      }
      .diff-cell.selected {
        border-color: #2b2a26;
        border-width: 2px;
        background: #faf7ef;
        box-shadow: 0 2px 8px rgba(43, 42, 38, 0.12);
      }
      .diff-name {
        font-size: 16px;
        font-weight: 600;
      }
      .diff-best {
        margin-top: 3px;
        font-size: 13px;
        color: #57544c;
        min-height: 1.2em;
      }
      .best-rating {
        font-weight: 700;
        margin-right: 5px;
      }
      .rating-S { color: #8a6d1f; }
      .rating-A { color: #37322a; }
      .rating-B { color: #57544c; }
      .rating-C { color: #a03d2c; }
      /* ── 键位图示（钢琴预览）── */
      .piano-preview {
        position: relative;
        height: 74px;
        margin-top: 8px;
      }
      .pk {
        position: absolute;
        top: 26px;
        width: 46px;
        height: 46px;
        border: 1px solid #b7b1a1;
        border-bottom-width: 4px;
        border-radius: 2px;
        background: #faf7ef;
        font-size: 17px;
        line-height: 46px;
        text-align: center;
        box-sizing: border-box;
        color: #57544c;
      }
      .pk.black {
        top: 0;
        width: 30px;
        height: 32px;
        line-height: 32px;
        font-size: 13px;
        border-color: #55503f;
        background: #37322a;
        color: #efe9dc;
        z-index: 1;
      }
      .pk.lit {
        background: #37322a;
        color: #efe9dc;
        border-color: #37322a;
      }
      /* ── 按钮 ── */
      .actions {
        display: flex;
        gap: 14px;
        margin-top: 10px;
      }
      .actions button {
        padding: 10px 26px;
        border: 1px solid #55503f;
        border-radius: 2px;
        background: #37322a;
        color: #efe9dc;
        font-family: inherit;
        font-size: 17px;
        letter-spacing: 0.15em;
        cursor: pointer;
      }
      .actions button.secondary {
        background: transparent;
        color: #37322a;
      }
      .actions button:hover {
        box-shadow: 0 2px 10px rgba(43, 42, 38, 0.25);
      }
      /* ── 设置（工单 06）── */
      .settings-box {
        display: flex;
        flex-direction: column;
        gap: 18px;
        width: min(560px, 88vw);
        padding: 20px 26px;
        border: 1px solid #d8d2c2;
        border-radius: 2px;
        background: rgba(250, 247, 239, 0.55);
      }
      .setting-row {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .setting-row label {
        font-size: 16px;
        color: #2b2a26;
      }
      .setting-row label b {
        color: #8a6d1f;
        margin-left: 6px;
      }
      .setting-row input[type='range'] {
        width: 100%;
        accent-color: #37322a;
        cursor: pointer;
      }
      /* ── 结算 ── */
      .rating-big {
        font-size: 128px;
        font-weight: 700;
        line-height: 1;
      }
      .new-record {
        padding: 3px 14px;
        border: 1px solid #8a6d1f;
        border-radius: 2px;
        color: #8a6d1f;
        font-size: 14px;
        letter-spacing: 0.2em;
      }
      .stats-line {
        font-size: 17px;
      }
      .stats-line b {
        font-weight: 700;
      }
      @keyframes inkBreath {
        0%, 100% { opacity: 0.92; transform: translateY(0); }
        50% { opacity: 1; transform: translateY(-1px); }
      }
      @keyframes promptBreath {
        0%, 100% { opacity: 0.72; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .screen h1,
        .start-prompt {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="overlay"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
